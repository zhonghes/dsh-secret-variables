<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900">
  <rect width="1800" height="900" fill="#ffffff"/>

  <rect x="90" y="160" width="430" height="360" rx="10" fill="#ffffff" stroke="#cfd4dc" stroke-width="2"/>
  <text x="120" y="232" font-family="Noto Sans SC, sans-serif" font-size="34" font-weight="700" fill="#23262b">你设置值</text>
  <text x="120" y="302" font-family="JetBrains Mono, monospace" font-size="25" fill="#23262b">OPENAI_API_KEY</text>
  <text x="120" y="350" font-family="Noto Sans SC, sans-serif" font-size="26" letter-spacing="1" fill="#23262b">••••••••</text>
  <rect x="120" y="390" width="132" height="40" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="186" y="417" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#6b7280" text-anchor="middle">只写不读</text>
  <text x="120" y="482" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#9ca3af">之后界面不再回显</text>

  <rect x="670" y="160" width="470" height="360" rx="10" fill="#ffffff" stroke="#cfd4dc" stroke-width="2"/>
  <text x="700" y="232" font-family="Noto Sans SC, sans-serif" font-size="34" font-weight="700" fill="#23262b">Host 保存</text>
  <text x="700" y="302" font-family="JetBrains Mono, monospace" font-size="24" fill="#23262b">$DSH_HOME/.credentials.yaml</text>
  <rect x="700" y="336" width="84" height="40" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="742" y="363" font-family="JetBrains Mono, monospace" font-size="22" fill="#6b7280" text-anchor="middle">0600</text>
  <text x="700" y="438" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#9ca3af">元数据里只存名称、范围和开关</text>

  <rect x="1290" y="160" width="430" height="360" rx="10" fill="#ffffff" stroke="#cfd4dc" stroke-width="2"/>
  <text x="1320" y="232" font-family="Noto Sans SC, sans-serif" font-size="34" font-weight="700" fill="#23262b">模型看到</text>
  <rect x="1320" y="268" width="368" height="52" rx="8" fill="#eef3ff" stroke="#b9c9f5"/>
  <text x="1338" y="302" font-family="JetBrains Mono, monospace" font-size="21" fill="#2f5bd7">$DSH_SECRET_OPENAI_API_KEY</text>
  <text x="1320" y="392" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#9ca3af">提示词、工具结果、日志</text>
  <text x="1320" y="428" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#9ca3af">里都只有引用</text>

  <line x1="520" y1="340" x2="660" y2="340" stroke="#23262b" stroke-width="3"/>
  <path d="M646 330l18 10-18 10z" fill="#23262b"/>
  <text x="590" y="312" font-family="Noto Sans SC, sans-serif" font-size="25" fill="#6b7280" text-anchor="middle">保存</text>

  <line x1="1140" y1="340" x2="1280" y2="340" stroke="#3366ff" stroke-width="3"/>
  <path d="M1266 330l18 10-18 10z" fill="#3366ff"/>
  <text x="1210" y="312" font-family="Noto Sans SC, sans-serif" font-size="25" fill="#2f5bd7" text-anchor="middle">只传引用</text>

  <rect x="748" y="650" width="980" height="180" rx="10" fill="#ffffff" stroke="#cfd4dc" stroke-width="2"/>
  <text x="780" y="716" font-family="Noto Sans SC, sans-serif" font-size="34" font-weight="700" fill="#23262b">命令执行时</text>
  <text x="780" y="766" font-family="JetBrains Mono, monospace" font-size="25" fill="#23262b">$DSH_SECRET_X → 真值</text>
  <text x="780" y="806" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#9ca3af">只注入一次性的 bash / pwsh</text>

  <line x1="905" y1="520" x2="905" y2="640" stroke="#23262b" stroke-width="3"/>
  <path d="M895 626l10 18 10-18z" fill="#23262b"/>
  <text x="928" y="588" font-family="Noto Sans SC, sans-serif" font-size="24" fill="#6b7280">执行时注入真值</text>

  <line x1="1505" y1="520" x2="1505" y2="640" stroke="#3366ff" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M1495 626l10 18 10-18z" fill="#3366ff"/>
  <text x="1480" y="588" font-family="Noto Sans SC, sans-serif" font-size="24" fill="#2f5bd7" text-anchor="end">命令里写 $DSH_SECRET_X</text>

  <text x="90" y="870" font-family="Noto Sans SC, sans-serif" font-size="25" fill="#4b5563">真值不进提示词、工具结果和会话日志；常驻终端等不注入的 shell 里，引用会被明确拒绝。</text>
</svg>
