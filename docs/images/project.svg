  <text x="1052" y="365" font-family="Noto Sans SC, sans-serif" font-size="25" fill="#ffffff" text-anchor="middle">添加</text>

  <rect x="90" y="420" width="1620" height="380" rx="12" fill="#ffffff" stroke="#d7dbe2"/>
  <line x1="90" y1="490" x2="1710" y2="490" stroke="#e3e6ea" stroke-width="2"/>
  <line x1="90" y1="610" x2="1710" y2="610" stroke="#e3e6ea" stroke-width="2"/>
  <line x1="90" y1="680" x2="1710" y2="680" stroke="#e3e6ea" stroke-width="2"/>

  <text x="120" y="468" font-family="Noto Sans SC, sans-serif" font-size="28" font-weight="700" fill="#23262b">本项目变量</text>
