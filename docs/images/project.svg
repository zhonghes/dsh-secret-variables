  <text x="1500" y="557" font-family="Noto Sans SC, sans-serif" font-size="23" fill="#23262b" text-anchor="middle">更换值</text>
  <text x="1630" y="559" font-family="Noto Sans SC, sans-serif" font-size="28" fill="#d64545" text-anchor="middle">✕</text>

