  <text x="120" y="748" font-family="JetBrains Mono, monospace" font-size="27" fill="#23262b">OPENAI_API_KEY</text>
  <text x="380" y="748" font-family="JetBrains Mono, monospace" font-size="22" fill="#9ca3af">$DSH_SECRET_OPENAI_API_KEY</text>
