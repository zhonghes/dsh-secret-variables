  <rect x="1356" y="726" width="56" height="28" rx="14" fill="#3366ff"/>
  <circle cx="1398" cy="740" r="11" fill="#ffffff"/>
  <text x="1710" y="748" font-family="Noto Sans SC, sans-serif" font-size="23" fill="#9ca3af" text-anchor="end">请在所属页修改</text>

  <text x="90" y="862" font-family="Noto Sans SC, sans-serif" font-size="25" fill="#4b5563">切到「项目」后先选择工作区；本项目变量可改值、删除。</text>
  <text x="90" y="904" font-family="Noto Sans SC, sans-serif" font-size="25" fill="#4b5563">全局变量只控制本项目的开关，改值请回到「全局」标签。</text>
